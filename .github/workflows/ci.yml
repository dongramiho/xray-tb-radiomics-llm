name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebBack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            WebBack/requirements.txt
            model/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2"
          pip install --no-build-isolation -e "../model[inference]"
          grep -vE '^-e' requirements.txt > /tmp/req.txt && pip install -r /tmp/req.txt
      - name: Lint
        run: |
          ruff check .
          ruff check --config pyproject.toml ../model/src ../model/config.py
          ruff format --check . ../model/src
      - name: Test (fake inference + fake LLM)
        env:
          INFERENCE_BACKEND: fake
          LLM_BACKEND: fake
        run: pytest
      - name: Migrations apply on a fresh database
        env:
          DATABASE_URL: sqlite:////tmp/ci.db
        run: alembic upgrade head

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebFront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: WebFront/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: WebBack/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: WebFront
          push: false
          build-args: NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
